name: Refresh listings

# The twice-daily refresh now runs on the AWS server (collect.sh) and BookMyShow on the
# Mac (collect-local.sh). This stays as a manual backup: Actions tab -> Run workflow. It reads
# every source whose runs_on includes github (District and BookMyShow refuse GitHub).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python run.py
      - name: Commit updated listings
        run: |
          git config user.name "listings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json s
          git diff --cached --quiet || git commit -m "Refresh listings $(date -u +%F)"
          # If the Mac's fuller run (collect-local.sh) uploaded meanwhile, keep its file.
          git pull --rebase -X ours
          git push
