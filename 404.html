<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · gigsnshows</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = "";
    try { t = localStorage.getItem("gns-theme") || ""; } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";   // no saved choice: follow the device
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --ink: rgba(255,255,255,.94); --ink-2: rgba(235,235,245,.62); --ink-3: rgba(235,235,245,.35);
    --line: rgba(84,84,88,.65); --field: rgba(255,255,255,.07);
    --glow: #0a84ff; --neon: #ff2d95;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --brand-font: "Outfit", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f5f7; --ink: rgba(0,0,0,.92); --ink-2: rgba(60,60,67,.74); --line: rgba(60,60,67,.2);
    --ink-3: rgba(60,60,67,.46); --field: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 72px; }
  .home { font-family: var(--brand-font); font-weight: 700; font-size: 1.3rem; text-decoration: none;
    background: linear-gradient(90deg, var(--glow), #8b5cf6 50%, var(--neon)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-family: var(--brand-font); font-size: 2rem; line-height: 1.15; margin: 28px 0 4px; }
  p { color: var(--ink-2); }
  a { color: var(--ink); }
  form { display: grid; gap: 16px; margin-top: 24px; }
  label { display: grid; gap: 6px; font-size: 0.9rem; font-weight: 600; }
  label small { color: var(--ink-3); font-weight: 400; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field);
    color: var(--ink); font: inherit; font-size: 1rem;
  }
  textarea { min-height: 150px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--glow); outline-offset: 1px; }
  .bot { position: absolute; left: -9999px; }
  button {
    justify-self: start; height: 46px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
    font: inherit; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--glow), #8b5cf6 50%, var(--neon));
  }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 0.82rem; color: var(--ink-3); margin: 0; }
  .status { margin: 0; font-weight: 600; }
  .status.ok { color: #30d158; }
  .status.err { color: #ff6b8b; }
  .status:empty { display: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0 16px; }
</style>
<style>
  .nf { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 14px; padding: 24px; }
  .nf h1 { margin: 0; font-family: var(--brand-font); font-size: clamp(2rem, 7vw, 3rem); }
  .nf p { margin: 0; color: var(--ink-2); }
  .nf a.go { justify-self: center; margin-top: 8px; padding: 13px 26px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main class="nf">
  <h1>That page isn't on the bill.</h1>
  <p>The link may be old, or mistyped. The shows are right where you left them.</p>
  <a class="go" href="/">See what's on</a>
</main>
</body>
</html>
